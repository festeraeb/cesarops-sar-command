# 2026-11-18 CESARops Field Command Unit (apps/server of cesarops-sar-command), one binary, two instances.
#  /sar-test/ : testers. Allowed: the operator (portal login) or a review-gate user on the gate's app_access list
#               (friend-gate gate.json "app_access": {"/sar-test": [...]}). X-Sar-User is ALWAYS set here, so a
#               client-sent header never reaches the app. Instance on 127.0.0.1:9291, per-user case stores.
#  /sar-demo/ : public demo, no login, in-memory sessions, instance on 127.0.0.1:9292.
location = /sar-test { return 301 /sar-test/; }
location = /sar-demo { return 301 /sar-demo/; }

location ^~ /sar-test/ {
    limit_except GET POST { deny all; }
    auth_request /_fcu_auth;
    auth_request_set $fcu_gate_user $upstream_http_x_sar_user;
    error_page 401 = @fcu_login;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:9291/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Sar-User $fcu_user;
    proxy_set_header X-Real-IP $portal_client_ip;
    proxy_set_header Cookie "";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /_fcu_auth {
    internal;
    proxy_pass http://127.0.0.1:8097/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $portal_client_ip;
    proxy_intercept_errors on;
    error_page 401 403 = /_fcu_gate_check;
}
location = /_fcu_gate_check {
    internal;
    proxy_pass http://127.0.0.1:9899/sonarsniffer/review/app-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
}
location @fcu_login {
    if ($http_accept ~* "text/html") {
        return 302 /sonarsniffer/review/login;
    }
    default_type application/json;
    return 401 '{"error":"sign in required","login":"/sonarsniffer/review/login"}';
}

location ^~ /sar-demo/ {
    limit_except GET POST { deny all; }
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:9292/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $portal_client_ip;
    proxy_set_header X-Sar-User "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
