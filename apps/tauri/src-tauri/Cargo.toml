[package]
name = "sar-command-desktop"
version = "0.1.0"
description = "Offline CESAROPS SAR command post"
edition = "2021"

[lib]
name = "sar_command_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.18"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
command-db = { path = "../../../crates/command-db" }
command-reports = { path = "../../../crates/command-reports" }
