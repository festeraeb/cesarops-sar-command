[workspace]
resolver = "2"
members = [
    "crates/sar-case-store",
    "crates/sar-family-report",
    "crates/sar-intake",
    "crates/sar-play",
    "crates/command-db",
    "crates/command-geo",
    "crates/command-reports",
    "apps/tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
